<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Bài Thi — PTIT</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .result-hero {
            background: linear-gradient(135deg, var(--ptit-dark), var(--ptit-navy));
            border-radius: var(--radius-lg);
            padding: 36px;
            color: #fff;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            overflow: hidden
        }
        .result-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 50%, rgba(192, 39, 45, .2) 0%, transparent 60%)
        }
        .score-value { font-size: 36px; font-weight: 800; color: #fff }
        .score-max { font-size: 16px; color: rgba(255,255,255,.6); font-weight: 500 }
        .stat-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap
        }
        .stat-item { text-align: center }
        .stat-val { font-size: 24px; font-weight: 800; color: #fff }
        .stat-lbl {
            font-size: 11px;
            color: rgba(255,255,255,.65);
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-top: 2px
        }
        .review-item {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 14px;
            overflow: hidden;
            transition: box-shadow var(--transition)
        }
        .review-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none
        }
        .review-header:hover { background: var(--surface2) }
        .review-body {
            padding: 0 18px 16px;
            border-top: 1px solid var(--border);
            display: none
        }
        .review-body.open { display: block }
        .review-explain {
            margin-top: 12px;
            padding: 12px 16px;
            background: var(--info-soft);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--info);
            border-left: 3px solid var(--info);
            line-height: 1.6
        }
        /* Pie chart fix */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px
        }
        .pie-card-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 260px
        }
        .pie-canvas-wrap {
            width: 180px;
            height: 180px;
            position: relative;
            flex-shrink: 0
        }
        .pie-legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px
        }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0 }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted) }
        @media (max-width: 700px) {
            .chart-grid { grid-template-columns: 1fr }
            .stat-row { gap: 20px }
        }
    </style>
</head>

<body>
    <!-- TOPBAR -->
    <div class="topbar">
        <a class="topbar-logo" href="dashboard.html" style="text-decoration:none">
            <div style="width:40px;height:40px;background:var(--ptit-red);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px">P</div>
            <div>
                <div class="logo-text">PExam PTIT</div>
                <div class="logo-sub">Kết quả bài thi</div>
            </div>
        </a>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions">
            <a href="dashboard.html" class="btn btn-ghost btn-sm"><i class="fas fa-home"></i> Trang chủ</a>
            <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fas fa-print"></i> In kết quả</button>
            <div class="dropdown" style="position:relative">
                <div class="topbar-user" id="userMenuBtn" style="cursor:pointer">
                    <div class="topbar-avatar" id="userAvatar">?</div>
                    <span id="userNameDisplay" style="font-size:13px;font-weight:600;color:var(--text);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
                    <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text-muted)"></i>
                </div>
                <div class="dropdown-menu" id="userDropdown" style="right:0;top:calc(100% + 8px)">
                    <a href="dashboard.html" class="dropdown-item"><i class="fas fa-tachometer-alt"></i> Trang chủ</a>
                    <div class="dropdown-divider"></div>
                    <button data-logout class="dropdown-item danger" style="width:100%;border:none;background:none;cursor:pointer;text-align:left"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
                </div>
            </div>
        </div>
    </div>

    <div class="user-layout">
        <div class="user-main">

            <!-- RESULT HERO -->
            <div class="result-hero" id="resultHero">
                <div id="passBadgeWrap" style="margin-bottom:16px"></div>
                <canvas id="scoreDonut" width="140" height="140" style="max-width:140px;margin:0 auto 16px;display:block"></canvas>
                <div class="score-value" id="scoreValue">—</div>
                <div class="score-max" id="scoreMax">/ 10 điểm</div>
                <div id="examTitleHero" style="font-size:15px;margin-top:8px;opacity:.8"></div>
                <div class="stat-row">
                    <div class="stat-item"><div class="stat-val" id="statCorrect">—</div><div class="stat-lbl">Câu đúng</div></div>
                    <div class="stat-item"><div class="stat-val" id="statWrong">—</div><div class="stat-lbl">Câu sai</div></div>
                    <div class="stat-item"><div class="stat-val" id="statSkipped">—</div><div class="stat-lbl">Bỏ qua</div></div>
                    <div class="stat-item"><div class="stat-val" id="statDuration">—</div><div class="stat-lbl">Thời gian</div></div>
                    <div class="stat-item"><div class="stat-val" id="statPct">—</div><div class="stat-lbl">Tỷ lệ đúng</div></div>
                </div>
            </div>

            <!-- CHARTS -->
            <div class="chart-grid" id="chartGrid">
                <div class="card">
                    <div class="card-header"><h4><i class="fas fa-chart-pie"></i> Phân bố câu trả lời</h4></div>
                    <div class="card-body pie-card-inner">
                        <div class="pie-canvas-wrap"><canvas id="pieChart"></canvas></div>
                        <div class="pie-legend">
                            <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div> Đúng</div>
                            <div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div> Sai</div>
                            <div class="legend-item"><div class="legend-dot" style="background:#94a3b8"></div> Bỏ qua</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h4><i class="fas fa-chart-bar"></i> So sánh với lớp</h4></div>
                    <div class="card-body"><div style="position:relative;height:220px"><canvas id="barChart"></canvas></div></div>
                </div>
            </div>

            <!-- REVIEW SECTION -->
            <div class="card" id="reviewSection">
                <div class="card-header">
                    <h4><i class="fas fa-list-alt"></i> Xem lại chi tiết câu trả lời</h4>
                    <div class="flex gap-2">
                        <span class="badge badge-green" id="correctCount"></span>
                        <span class="badge badge-red" id="wrongCount"></span>
                    </div>
                </div>
                <div class="card-body" id="reviewBody">
                    <div style="text-align:center;padding:20px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i> Đang tải...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/data.js"></script>
    <script>
        function esc(t) {
            if (!t) return '';
            return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        const session = Auth.requireAuth('student');
        document.getElementById('userAvatar').textContent = session.avatar || session.name[0];
        document.getElementById('userNameDisplay').textContent = session.name;

        const menuBtn = document.getElementById('userMenuBtn');
        const dropMenu = document.getElementById('userDropdown');
        menuBtn.addEventListener('click', e => { e.stopPropagation(); menuBtn.closest('.dropdown').classList.toggle('open'); });
        document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open')));
        document.querySelectorAll('[data-logout]').forEach(b => b.addEventListener('click', () => { Auth.logout(); location.href = '../index.html'; }));

        const params = new URLSearchParams(location.search);
        const examId = params.get('examId');

        async function initResults() {
            if (!examId) { alert('Thiếu examId!'); location.href = 'dashboard.html'; return; }

            await DB.load();

            // 1. Load exam details (questions + options + explanations)
            const exam = await DB.getExamDetails(examId);
            if (!exam) { alert('Không tìm thấy bài thi!'); location.href = 'dashboard.html'; return; }

            const questions = exam.questions || [];

            // 2. Get the result
            let result = null;
            let studentAnswerMap = {}; // questionId -> display_order of selected option (0-indexed)

            // If ?new=1, try sessionStorage first
            if (params.get('new')) {
                const sr = JSON.parse(sessionStorage.getItem('lastResult') || 'null');
                if (sr && String(sr.examId) === String(examId)) {
                    result = sr;
                    // sr.answers is array of option display_orders indexed by question order
                    if (Array.isArray(sr.answers)) {
                        questions.forEach((q, i) => {
                            studentAnswerMap[q.id] = sr.answers[i] ?? -1;
                        });
                    }
                }
            }

            // Always fetch from backend for authoritative result + stored answers
            const backendResult = await DB.getExamResult(examId);
            if (backendResult) {
                result = backendResult;
                // studentAnswers: [{question_id, selected_option_order}]
                if (backendResult.studentAnswers && backendResult.studentAnswers.length > 0) {
                    studentAnswerMap = {};
                    backendResult.studentAnswers.forEach(sa => {
                        // selected_option_order is the display_order (0-indexed position in UI)
                        studentAnswerMap[sa.question_id] = sa.selected_option_id == null ? -1 : (sa.selected_option_order ?? -1);
                    });
                }
            }

            if (!result) { alert('Không tìm thấy kết quả!'); location.href = 'dashboard.html'; return; }

            // 3. Compute stats
            const correct = result.correct_answers ?? result.correct ?? 0;
            const total = result.total_questions ?? result.total ?? questions.length;
            const scoreNum = parseFloat(result.score) || 0;
            const passingScore = result.passing_score ?? exam.passing_score ?? 5;
            const totalScore = result.exam_total_score ?? exam.total_score ?? 10;
            const isPassed = scoreNum >= passingScore;

            let skipped = 0, wrong = 0;
            if (Object.keys(studentAnswerMap).length > 0) {
                Object.values(studentAnswerMap).forEach(v => { if (v === -1 || v == null) skipped++; });
                wrong = total - correct - skipped;
            } else {
                wrong = total - correct;
            }

            const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

            // 4. Fill hero
            document.getElementById('scoreValue').textContent = scoreNum.toFixed(2);
            document.getElementById('scoreMax').textContent = `/ ${totalScore} điểm`;
            document.getElementById('examTitleHero').textContent = exam.title || '';
            document.getElementById('statCorrect').textContent = correct;
            document.getElementById('statWrong').textContent = wrong;
            document.getElementById('statSkipped').textContent = skipped;
            document.getElementById('statDuration').textContent = (result.duration || '—') + ' phút';
            document.getElementById('statPct').textContent = pct + '%';
            document.getElementById('passBadgeWrap').innerHTML = `<span class="badge ${isPassed ? 'badge-green' : 'badge-red'}" style="font-size:14px;padding:8px 20px">${isPassed ? '✅ ĐẠT' : '❌ KHÔNG ĐẠT'}</span>`;

            // 5. Donut
            new Chart(document.getElementById('scoreDonut').getContext('2d'), {
                type: 'doughnut',
                data: { datasets: [{ data: [scoreNum, totalScore - scoreNum], backgroundColor: [isPassed ? '#16a34a' : '#dc2626', 'rgba(255,255,255,.15)'], borderWidth: 0 }] },
                options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: { duration: 1000 } }
            });

            // 6. Pie chart - centred properly
            new Chart(document.getElementById('pieChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: ['Đúng', 'Sai', 'Bỏ qua'], datasets: [{ data: [correct, wrong, skipped], backgroundColor: ['#16a34a', '#dc2626', '#94a3b8'], borderWidth: 0 }] },
                options: { cutout: '55%', plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: true }
            });

            // 7. Bar chart
            const allResultsObj = await DB.loadExamResults(examId) || [];
            const scores = allResultsObj.map(r => parseFloat(r.score));
            const classAvg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : scoreNum;
            const maxScore = scores.length ? Math.max(...scores, scoreNum) : scoreNum;
            const minScore = scores.length ? Math.min(...scores, scoreNum) : scoreNum;
            new Chart(document.getElementById('barChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['Điểm của bạn', 'Điểm TB lớp', 'Cao nhất', 'Thấp nhất'],
                    datasets: [{ data: [scoreNum, +classAvg.toFixed(2), maxScore, minScore], backgroundColor: [isPassed ? '#16a34a' : '#dc2626', '#0284c7', '#d97706', '#94a3b8'], borderRadius: 6 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: totalScore, grid: { color: '#e2e8f0' } }, x: { grid: { display: false } } } }
            });

            // 8. Review section
            const reviewBody = document.getElementById('reviewBody');
            if (questions.length === 0) {
                document.getElementById('reviewSection').style.display = 'none';
                document.getElementById('chartGrid').style.gridTemplateColumns = '1fr';
                return;
            }

            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            document.getElementById('correctCount').textContent = `${correct} đúng`;
            document.getElementById('wrongCount').textContent = `${wrong + skipped} sai/bỏ`;

            let reviewHtml = '';
            questions.forEach((q, i) => {
                // Determine which option index the user picked (0-based display_order)
                const userAnsOrder = studentAnswerMap[q.id] ?? -1;

                // Find the correct option index (display_order of correct option)
                let correctIdx = -1;
                if (q.options && q.options.length > 0) {
                    correctIdx = q.options.findIndex(o => o.is_correct == 1 || o.is_correct === true);
                }

                const isCorrect = userAnsOrder !== -1 && userAnsOrder === correctIdx;
                const isSkipped = userAnsOrder === -1;
                const icon = isCorrect ? '✅' : isSkipped ? '⬜' : '❌';
                const headerBg = isCorrect ? 'var(--success-soft)' : isSkipped ? 'var(--surface2)' : 'var(--danger-soft)';

                let optsHtml = '';
                if (q.options && q.options.length > 0) {
                    optsHtml = q.options.map((opt, j) => {
                        const isCorrectOpt = j === correctIdx;
                        const isUserPick = j === userAnsOrder;
                        let cls = '', bg = 'var(--surface)', border = 'var(--border)';
                        if (isCorrectOpt) { cls = 'correct'; bg = 'var(--success-soft)'; border = 'var(--success)'; }
                        else if (isUserPick) { cls = 'wrong'; bg = 'var(--danger-soft)'; border = 'var(--danger)'; }
                        const label = isCorrectOpt ? '<strong style="color:var(--success);margin-left:8px">(Đáp án đúng)</strong>' : (isUserPick ? '<strong style="color:var(--danger);margin-left:8px">(Bạn chọn)</strong>' : '');
                        return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;border:2px solid ${border};border-radius:var(--radius-sm);background:${bg}">
                            <div style="font-weight:800;width:26px;height:26px;border-radius:50%;background:${isCorrectOpt?'var(--success)':isUserPick?'var(--danger)':'var(--surface2)'};color:${(isCorrectOpt||isUserPick)?'#fff':'var(--text-muted)'};display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${letters[j]}</div>
                            <div style="flex:1;font-size:14px">${esc(opt.content || '')}${label}</div>
                        </div>`;
                    }).join('');
                }

                const explanationHtml = q.explanation
                    ? `<div class="review-explain"><i class="fas fa-lightbulb" style="margin-right:6px"></i><strong>Giải thích:</strong><br>${esc(q.explanation)}</div>`
                    : '';

                reviewHtml += `<div class="review-item">
                    <div class="review-header" style="background:${headerBg}" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.toggle-icon').classList.toggle('fa-rotate-180')">
                        <span style="font-size:16px;margin-right:10px;flex-shrink:0">${icon}</span>
                        <div style="flex:1;font-weight:600;font-size:14px;color:var(--text)">Câu ${i + 1}: ${esc(q.content || '')}</div>
                        <i class="fas fa-chevron-down toggle-icon" style="color:var(--text-muted);transition:transform .2s;font-size:13px;flex-shrink:0"></i>
                    </div>
                    <div class="review-body">
                        <div style="margin-top:14px">${optsHtml}</div>
                        ${explanationHtml}
                    </div>
                </div>`;
            });

            reviewBody.innerHTML = reviewHtml;
        }

        initResults();
    </script>
</body>

</html>
